<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Fotografi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pesanPage">
    <div class="booking-card">
        <h2>Book Your Session</h2>
        

        <form id="photographyForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Contoh: Cahyo Saputra" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lokasi</label>
                <textarea id="alamat" placeholder="Masukkan alamat lengkap" required></textarea>
            </div>

            <div class="form-group">
    <label for="jasa">Pilihan Jasa</label>
    <input type="text" id="jasa" name="jasa" readonly required>
</div>

            <div class="form-group">
                <label for="tanggal">Tanggal Booking</label>
                <input type="date" id="tanggal" required>
            </div>


            <button type="submit" class="submit-btn">Pesan Sekarang</button>
            <a href="jasa.html" class="back-btn">Kembali ke Jasa</a>
        </form>


    </div>
</div>
    <script>
document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const paketParam = urlParams.get('paket');
        
        if (paketParam) {
            document.getElementById('jasa').value = paketParam;
        }

        const form = document.getElementById('photographyForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const namaValue = document.getElementById('nama').value;
            const alamatValue = document.getElementById('alamat').value;
            const jasaValue = document.getElementById('jasa').value;
            const tanggalValue = document.getElementById('tanggal').value;

            const pesanKonfirmasi = 
                "--- RANGKUMAN PESANAN FOTOGRAFI ---\n\n" +
                "Nama Pelanggan : " + namaValue + "\n" +
                "Alamat Tujuan  : " + alamatValue + "\n" +
                "Jenis Layanan  : " + jasaValue + "\n" +
                "Tanggal Booking: " + tanggalValue + "\n\n" +
                "Pesanan Anda telah kami terima. Terima kasih!";
            
            alert(pesanKonfirmasi);
            window.location.href = 'upload_bukti.html';
        });
    });

        const urlParams = new URLSearchParams(window.location.search);
        const paketDipilih = urlParams.get('paket');

    if (paketDipilih) {
        const selectElement = document.getElementById('paket-input');
        if (selectElement) {
            selectElement.value = paketDipilih;
        }
    }
    </script>
</body>
</html>
